# Production nginx (decision 0025): the single entry point of the domain. The site itself is
# /etc/nginx/site.conf, chosen at start by /docker-entrypoint.d/40-select-site.sh: the full site
# (templates/app.conf.template) once the TLS certificate exists, otherwise only the ACME challenge
# (templates/acme.conf.template) so certbot can issue the first certificate.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's embedded DNS: the upstream name is resolved per request, so a recreated server
    # container (new IP) does not break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/site.conf;
}
